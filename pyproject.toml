[project]
name = "cryptotrader"
version = "0.1.0"
description = "A DQN-based crypto trading project"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "gymnasium>=1,<2",
    "numpy>=2,<3",
    "torch>=2,<3",
    "stable-baselines3>=2,<3",
    "python-binance>=1,<2",
    "pandas>=2,<3"
]

[dependency-groups]
dev = [
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
